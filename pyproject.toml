[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow-core"
version = "0.1.0"
description = "Winnow's CPU-side compression core: AttentionRAG selection, the two-compressor token merge, and the model-artifact guard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Winnow" }]
keywords = ["prompt-compression", "rag", "kv-cache", "llm"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core is deliberately STDLIB ONLY. `attentionrag.core` is the paper's
# selection logic behind a Backend protocol, `token_merge` is pure string/span
# arithmetic, and `model_guard`'s validation path uses pickletools/hashlib/
# zipfile. That is what makes this half installable and testable without a GPU.
dependencies = []

[project.optional-dependencies]
# Only needed for `attentionrag.hf_backend` (the model-touching half) and for
# `model_guard.safe_load_state_dict` reading real tensors. Pinned, not floated:
# the guard's whole point is that "the same model name" must not mean different
# bytes tomorrow, and the same argument applies to the loader.
# numpy is pinned to 2.4.6, not the newest release: safetensors needs numpy to
# convert torch tensors, and numpy 2.5.x publishes no cp311 wheel, which is the
# interpreter the Modal images use. Verified by installing, not by reading.
hf = [
    "torch==2.14.0",
    "transformers==5.16.1",
    "safetensors==0.8.0",
    "huggingface-hub==1.30.0",
    "accelerate==1.14.0",
    "numpy==2.4.6",
]

[project.urls]
Homepage = "https://github.com/TC960/winnow"

[tool.setuptools]
py-modules = ["model_guard", "token_merge"]

[tool.setuptools.packages.find]
include = ["attentionrag*"]
exclude = ["attentionrag.test_*"]
